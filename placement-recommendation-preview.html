<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>คอร์สที่แนะนำ — ทุกกรณี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#004aad; --blue-soft:#e8f0fc; --blue-tint:#f4f8ff;
    --yellow:#ffcc00; --yellow-soft:#fff6d6;
    --ink:#1b2230; --muted:#6b7488; --line:#e8e6df; --paper:#fffdf7;
    --good:#1a8a55; --good-soft:#e4f6ec; --bad:#cf4436; --bad-soft:#fdeeec;
    --r-lg:28px; --r-md:18px;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Mali',sans-serif; line-height:1.8; }
  .wrap { max-width:880px; margin:0 auto; padding:30px 18px 90px; }
  h1 { font-size:21px; margin:0 0 6px; }
  .intro { color:var(--muted); font-size:14.5px; margin:0 0 30px; }
  .case { background:#fff; border:1px solid var(--line); border-radius:var(--r-lg); padding:26px; margin-bottom:22px; box-shadow:0 14px 34px -26px rgba(27,34,48,.35); }
  .caseTitle { font-size:16px; font-weight:700; }
  .caseRule { font-size:12.5px; color:var(--muted); }
  .bands { display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 4px; }
  .b { border-radius:999px; padding:4px 13px; font-size:12.5px; font-weight:600; background:var(--blue-soft); color:var(--blue); }
  .b.low { background:var(--bad-soft); color:var(--bad); }
  .b.high { background:var(--good-soft); color:var(--good); }
  h3 { font-size:15px; margin:22px 0 0; }
  .headline { font-size:14.5px; color:var(--muted); margin:6px 0 0; }

  .gaps { display:grid; gap:12px; margin-top:14px; }
  .gap { background:var(--yellow-soft); border:1px solid var(--yellow); border-radius:var(--r-md); padding:16px 18px; }
  .gapHead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .gapSkill { font-weight:700; font-size:16px; }
  .gapBand { font-size:13px; color:#8a6a00; font-weight:600; }
  .gapMissing { margin:6px 0 0; font-size:14.5px; color:#6b5000; }
  .gapLesson { margin:10px 0 0; font-size:14px; color:var(--ink); }
  .gapLessonTag { display:inline-block; background:#fff; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:700; color:#8a6a00; margin-right:6px; }

  .offer { display:flex; gap:18px; align-items:flex-start; text-decoration:none; color:inherit; background:var(--blue-tint); border:2px solid var(--blue); border-radius:var(--r-md); padding:18px; margin-top:16px; transition:transform .12s, box-shadow .15s; }
  .offer:hover { transform:translateY(-2px); box-shadow:0 14px 28px -18px rgba(0,74,173,.8); }
  .thumb { width:148px; height:auto; border-radius:12px; flex:0 0 auto; background:#fff; border:1px solid var(--line); }
  .offerBody { flex:1 1 auto; min-width:0; }
  @media (max-width:560px){ .offer{flex-direction:column;} .thumb{width:100%;} }
  .offerTag { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--blue); }
  .offerTitle { font-size:18px; font-weight:700; margin-top:4px; line-height:1.5; }
  .offerPrice { font-size:20px; font-weight:700; color:var(--blue); margin-top:6px; }
  .offerWhy { font-size:14.5px; color:var(--muted); margin:8px 0 0; }
  .offerCta { display:inline-block; margin-top:12px; font-weight:700; color:var(--blue); font-size:15px; }
  .allLink { font-size:13.5px; margin-top:12px; }
  a { color:var(--blue); }
</style>
</head>
<body>
<div class="wrap">
  <h1>ส่วน “คอร์สที่เหมาะกับคุณ” — ทุกกรณีที่เกิดขึ้นได้</h1>
  <p class="intro">
    ระบบเลือกคอร์สจาก<strong>ทักษะที่ยังไม่ถึงเป้า</strong> ไม่ได้เลือกจากราคาครับ —
    ทักษะที่ได้ 6.0 หรือต่ำกว่าถือว่า “ยังต้องเก็บ” และทุกกล่องเหลืองจะบอกว่า<strong>ขาดอะไร</strong>
    และ<strong>เรียนบทไหนถึงจะแก้ได้</strong> ไม่มีคอร์สปูพื้นแกรมม่าแยก เพราะแพ็กเกจ 6 เดือนคลุมให้อยู่แล้วครับ
  </p>
  <div id="stage"></div>
</div>

<script>
const SITE='https://www.language-plan.com';
const CDN='https://import.cdn.thinkific.com/563960';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const IMG = {
  writing:  CDN+'/54IJMT4NSSuO4HPUAVug_11.png',
  reading:  CDN+'/t1nYjGlTTL2eK0pDaDcC_12.png',
  listening:CDN+'/vMlJAp6SEmFru8uiEA0A_14.png',
  speaking: CDN+'/bXDhzeTR9u130qWZY3zQ_13.png'
};

const G = {
  reading: {
    low:{missing:'พื้นฐานการอ่านและคำศัพท์ยังไม่แน่น ทำให้ตีความประโยคที่ให้มาตรง ๆ ยังพลาดครับ', lesson:'บท “รูปแบบ paraphrase & synonyms ที่จะเจอในข้อสอบ” และ “Technique การทำ True, false, not given”'},
    mid:{missing:'ยังจับใจความหลัก (main idea) และตีความโครงสร้างงานเขียนวิชาการไม่ได้ จึงโดนตัวเลือกที่มีคำซ้ำหลอกครับ', lesson:'บท “Technique ทำ matching heading” และ “Technique การทำ matching information”'},
    high:{missing:'ยังตีความสิ่งที่อยู่เหนือคำศัพท์ตรงตัวไม่ได้ ซึ่งเป็นเส้นแบ่งระหว่าง 6.5 กับ 7.0 ครับ', lesson:'บท “Ultimate Tips & Tricks + Patterns” และเฉลย Cambridge 20 ละเอียดทั้งเล่ม'},
    course:'คอร์ส Intensive Academic Reading'
  },
  listening: {
    low:{missing:'ยังจับข้อมูลตรง ๆ อย่างชื่อ ตัวสะกด และตัวเลขใน Section 1 ได้ไม่ครบครับ', lesson:'บท “Section 1 — Practical Listening” และ Hotel Reservation Practice'},
    mid:{missing:'ยังโดนตัวหลอก (distractors) และการ paraphrase ในบทสนทนา Section 2 ดึงออกจากคำตอบครับ', lesson:'บท “Section 2 — Everyday Context” ที่เน้น Match info, Multiple choice และการรับมือ distractors'},
    high:{missing:'ยังตามเลกเชอร์วิชาการยาว ๆ ใน Section 4 ไม่ทัน ซึ่งเป็นด่านของ Band 7 ครับ', lesson:'บท “Section 4 — Monologue & Lecture” (The Monologue Strategy)'},
    course:'คอร์ส Listening for Band 7'
  },
  writing: {
    low:{missing:'ยังใช้ past tense และเครื่องหมายวรรคตอนจบประโยคผิด ซึ่งเป็นจุดที่กรรมการหักคะแนนก่อนเลยครับ', lesson:'บท “สูตรลัดเรื่อง Tense for Band 7” และ “การใช้ Article (a/an/the) ไม่ให้โดนหักคะแนน”'},
    mid:{missing:'ยังวางลูกน้ำคั่นส่วนขยายและอนุประโยคไม่ถูก ทำให้ประโยคยาว ๆ เสียคะแนนครับ', lesson:'บท “Writing Basics” และ “เทคนิค Complex Structures for Band 7”'},
    high:{missing:'ไวยากรณ์สะอาดแล้ว แต่ flow คลังคำศัพท์ และไวยากรณ์ระดับสูงในงานเขียนของตัวเองยังไม่ถึง 7.0 ครับ', lesson:'บท “สรุป Transitional words สำหรับ Band 7” พร้อมส่งงานเขียนให้พี่ดอยตรวจเองได้ 12 ฉบับ'},
    course:'คอร์ส Academic Writing Intensive'
  },
  speaking: {
    low:{missing:'ยังมี tense และ article ผิดระหว่างพูด ซึ่งเป็นตัวกดคะแนนไว้ที่ 5.5–6.0 ครับ', lesson:'Day 1 “เพิ่ม fluency ด้วย past tense” และ Day 7 “Focus on using past tenses in speaking”'},
    mid:{missing:'พูดถูกแล้ว แต่ยังไม่ได้ใช้ past tense และยังเรียบเรียงไอเดียไม่เป็นลำดับครับ', lesson:'Day 2 “เรียบเรียง Idea ให้มี Logic” และ “การใช้ discourse markers เพื่อเพิ่ม fluency”'},
    high:{missing:'ตอบสั้นและใช้คำศัพท์พื้นฐานเป็นหลัก ยังไม่มี collocation ระดับ B2–C1 มากพอสำหรับ 7.0 ครับ', lesson:'Day 4–6 “How to speak for 2 minutes” และคลัง Vocabulary สำหรับ Part 2'},
    course:'คอร์ส Speaking Intensive'
  }
};
const TH = { reading:'การอ่าน', listening:'การฟัง', writing:'การเขียน', speaking:'การพูด' };
const gap = (skill, rung, band) => ({ skill:TH[skill], band, missing:G[skill][rung].missing, lesson:G[skill][rung].lesson, course:G[skill].course });

const CASES = [
  {
    title:'ทั้ง 4 ทักษะยังไม่ถึงเป้า', rule:'weak = 4  →  All Skills Package',
    bands:[['อ่าน','5.5–6.0','low'],['ฟัง','5.5–6.0','low'],['เขียน','5.5–6.0','low'],['พูด','6.0','']],
    headline:'ทั้ง 4 ทักษะยังต้องเก็บ แนะนำเรียนรวดเดียวจะคุ้มกว่าแยกซื้อครับ',
    gaps:[gap('reading','low','5.5–6.0'),gap('listening','low','5.5–6.0'),gap('writing','low','5.5–6.0'),gap('speaking','mid','6.0')],
    offer:{ title:'All Skills Package — ครบทั้ง 4 ทักษะ', price:'฿7,990 (3 เดือน) / ฿8,990 (6 เดือน)', url:SITE+'/pages/ielts-all-skills', img:IMG.writing,
      why:'ครอบคลุมทั้ง 4 ทักษะในราคาถูกกว่าซื้อแยกเกือบครึ่ง แบบ 6 เดือนมีปูพื้นแกรมม่าให้ในตัวแล้วครับ' }
  },
  {
    title:'3 ทักษะยังไม่ถึงเป้า', rule:'weak = 3  →  3 Skills Package',
    bands:[['อ่าน','6.0',''],['ฟัง','6.0',''],['เขียน','6.5–7.0','high'],['พูด','6.0','']],
    headline:'ทักษะที่ต้องเก็บคือ การอ่าน การฟัง การพูด ครับ',
    gaps:[gap('reading','mid','6.0'),gap('listening','mid','6.0'),gap('speaking','mid','6.0')],
    offer:{ title:'3 Skills Package', price:'฿7,590 (3 เดือน) / ฿8,590 (6 เดือน)', url:SITE+'/pages/ielts-all-skills', img:IMG.reading,
      why:'เลือกได้ 3 ทักษะที่ยังไม่ถึงเป้า ถูกกว่าซื้อแยกทีละคอร์ส และแบบ 6 เดือนมีปูพื้นแกรมม่าให้ด้วยครับ' }
  },
  {
    title:'2 ทักษะ และหนึ่งในนั้นคือการเขียน', rule:'weak = 2 (รวม writing)  →  Writing + อีก 1 ทักษะ',
    bands:[['อ่าน','6.0',''],['ฟัง','6.5',''],['เขียน','6.0',''],['พูด','6.5','']],
    headline:'ทักษะที่ต้องเก็บคือ การอ่าน การเขียน ครับ',
    gaps:[gap('reading','mid','6.0'),gap('writing','mid','6.0')],
    offer:{ title:'Writing + Reading หรือ Speaking', price:'฿5,990 (3 เดือน) / ฿6,990 (6 เดือน)', url:SITE+'/pages/ielts-all-skills', img:IMG.writing,
      why:'รวม Writing ซึ่งเป็นทักษะที่ต้องมีคนตรวจให้ เข้ากับอีกทักษะที่คุณยังไม่ถึงเป้าครับ' }
  },
  {
    title:'2 ทักษะ แต่การเขียนผ่านแล้ว', rule:'weak = 2 (ไม่รวม writing)  →  2 Skills (ไม่รวม Writing)',
    bands:[['อ่าน','6.0',''],['ฟัง','6.0',''],['เขียน','6.5–7.0','high'],['พูด','6.5','']],
    headline:'ทักษะที่ต้องเก็บคือ การอ่าน การฟัง ครับ',
    gaps:[gap('reading','mid','6.0'),gap('listening','mid','6.0')],
    offer:{ title:'2 Skills (ไม่รวม Writing)', price:'฿4,990 (3 เดือน) / ฿5,590 (6 เดือน)', url:SITE+'/pages/ielts-all-skills', img:IMG.listening,
      why:'จับคู่สองทักษะที่ยังไม่ถึงเป้า ในราคาที่ถูกกว่าซื้อแยกครับ' }
  },
  {
    title:'เหลือทักษะเดียว', rule:'weak = 1  →  คอร์สเดี่ยวของทักษะนั้น',
    bands:[['อ่าน','6.5–7.0','high'],['ฟัง','7.0 ขึ้นไป','high'],['เขียน','6.0–6.5',''],['พูด','6.5','']],
    headline:'เหลือแค่การเขียนที่ยังไม่ถึงเป้าครับ',
    gaps:[gap('writing','mid','6.0–6.5')],
    offer:{ title:'IELTS Academic Writing — Intensive', price:'฿4,990', url:SITE+'/courses/ielts-writing-5', img:IMG.writing,
      why:'เจาะเฉพาะการเขียนโดยตรง ไม่ต้องจ่ายเผื่อทักษะที่คุณผ่านแล้วครับ' }
  },
  {
    title:'ผ่านหมดทุกทักษะ', rule:'weak = 0  →  ดันทักษะที่ต่ำสุดให้ข้าม 7.0',
    bands:[['อ่าน','6.5','' ],['ฟัง','7.0 ขึ้นไป','high'],['เขียน','6.5–7.0','high'],['พูด','6.5','']],
    headline:'พื้นฐานคุณแน่นแล้ว เหลือแค่ดันให้ข้าม 7.0 ครับ',
    gaps:[gap('reading','high','6.5')],
    offer:{ title:'Intensive Academic Reading for IELTS', price:'฿3,990', url:SITE+'/courses/intensive-academic-reading-for-ielts', img:IMG.reading,
      why:'จุดที่กั้นคุณจาก 7.0 อยู่ที่การอ่าน คอร์สนี้เจาะตรงนั้นโดยเฉพาะครับ' }
  }
];

document.getElementById('stage').innerHTML = CASES.map(c => `
  <div class="case">
    <div class="caseTitle">${esc(c.title)}</div>
    <div class="caseRule">${esc(c.rule)}</div>
    <div class="bands">${c.bands.map(([s,b,cls]) => `<span class="b ${cls}">${s} ${b}</span>`).join('')}</div>

    <h3>คอร์สที่เหมาะกับคุณ</h3>
    <p class="headline">${esc(c.headline)}</p>

    <div class="gaps">
      ${c.gaps.map(g => `
        <div class="gap">
          <div class="gapHead"><span class="gapSkill">${esc(g.skill)}</span><span class="gapBand">${esc(g.band)}</span></div>
          <p class="gapMissing">${esc(g.missing)}</p>
          <p class="gapLesson"><span class="gapLessonTag">เรียนที่</span> ${esc(g.course)} — ${esc(g.lesson)}</p>
        </div>`).join('')}
    </div>

    <a class="offer" href="${c.offer.url}" target="_blank" rel="noreferrer">
      <img class="thumb" src="${c.offer.img}" alt="${esc(c.offer.title)}" loading="lazy" />
      <div class="offerBody">
        <div class="offerTag">แนะนำสำหรับคุณ</div>
        <div class="offerTitle">${esc(c.offer.title)}</div>
        <div class="offerPrice">${esc(c.offer.price)}</div>
        <p class="offerWhy">${esc(c.offer.why)}</p>
        <span class="offerCta">ดูรายละเอียดคอร์ส →</span>
      </div>
    </a>
    <p class="allLink">อยากเทียบแพ็กเกจอื่นก่อนตัดสินใจ?
      <a href="${SITE}/pages/ielts-all-skills" target="_blank" rel="noreferrer">ดูแพ็กเกจ IELTS ทั้งหมด</a></p>
  </div>`).join('');
</script>
</body>
</html>
