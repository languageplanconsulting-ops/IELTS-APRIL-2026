<!doctype html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IELTS Placement Test — preview</title>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #004aad;
    --blue-deep: #00337a;
    --blue-soft: #e8f0fc;
    --blue-tint: #f4f8ff;
    --yellow: #ffcc00;
    --yellow-soft: #fff6d6;
    --yellow-deep: #d9a800;
    --ink: #1b2230;
    --muted: #6b7488;
    --line: #e8e6df;
    --paper: #fffdf7;   /* warm, not clinical grey */
    --card: #ffffff;
    --good: #1a8a55;
    --good-soft: #e4f6ec;
    --bad: #cf4436;
    --bad-soft: #fdeeec;
    --r-lg: 28px;
    --r-md: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Mali', -apple-system, "Noto Sans Thai", sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .devstrip {
    background: #17202f; color: #cfd6e6; font-size: 12px;
    padding: 7px 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .devstrip button {
    background: #2b3648; color: #dce3f2; border: 0; border-radius: 999px;
    padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }

  /* ---------- shell: one question fills the screen ---------- */
  .shell { min-height: calc(100dvh - 34px); display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 5; background: var(--paper);
    padding: 14px 20px 10px; border-bottom: 1px solid var(--line);
  }
  .topbar .inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .segs { display: flex; gap: 6px; flex: 1; }
  .seg { height: 9px; border-radius: 999px; background: #ece9e0; flex: 1; overflow: hidden; }
  .seg i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 999px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .seg.done i { width: 100% !important; background: var(--yellow); }
  .topbar .label { font-size: 13px; color: var(--muted); white-space: nowrap; font-weight: 500; }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 28px 20px 40px;
  }
  .panel { width: 100%; max-width: 720px; }
  @media (max-width: 640px) {
    main { align-items: flex-start; padding: 20px 16px 36px; }
  }

  .fade { animation: rise .42s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .leaving { animation: sink .18s ease-in both; }
  @keyframes sink { to { opacity: 0; transform: translateY(-12px); } }

  /* ---------- type ---------- */
  .eyebrow {
    font-size: 12.5px; color: var(--blue); letter-spacing: .1em; text-transform: uppercase;
    font-weight: 700; margin-bottom: 6px;
  }
  h2 { font-size: clamp(21px, 3.4vw, 27px); margin: 0 0 8px; font-weight: 700; line-height: 1.45; }
  .lead { font-size: clamp(16px, 2.4vw, 18px); color: var(--muted); margin: 0 0 22px; }
  .question {
    font-size: clamp(18px, 2.9vw, 23px); font-weight: 600; line-height: 1.6; margin: 0 0 20px;
  }
  .note { font-size: 13.5px; color: var(--muted); }

  /* ---------- surfaces ---------- */
  .box {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: clamp(20px, 3.6vw, 34px);
    box-shadow: 0 2px 0 rgba(27,34,48,.04), 0 14px 34px -22px rgba(27,34,48,.3);
  }
  .instruction {
    background: var(--blue-soft); border-radius: var(--r-md); padding: 14px 18px;
    font-size: 14.5px; color: var(--blue-deep); margin: 0 0 18px;
  }
  .instruction strong { font-weight: 700; }
  .caution {
    background: var(--yellow-soft); border-radius: var(--r-md); padding: 14px 18px;
    font-size: 14.5px; color: #6b5000; margin: 0 0 18px;
  }
  .passage {
    background: var(--blue-tint); border-radius: var(--r-md); padding: 18px 20px;
    margin: 0 0 22px; font-size: clamp(15px, 2.2vw, 16.5px); line-height: 2;
  }

  /* ---------- choices ---------- */
  .choices { display: grid; gap: 11px; }
  .choice {
    display: flex; gap: 13px; align-items: flex-start; padding: 15px 18px;
    border: 2px solid var(--line); border-radius: var(--r-md); cursor: pointer; background: #fff;
    font-size: clamp(15px, 2.2vw, 16.5px); transition: transform .12s, border-color .15s, background .15s;
  }
  .choice:hover { border-color: var(--blue); background: var(--blue-tint); transform: translateY(-1px); }
  .choice.on { border-color: var(--blue); background: var(--blue-soft); }
  .choice input { margin-top: 8px; accent-color: var(--blue); }
  .key {
    font-weight: 700; min-width: 26px; color: var(--blue);
  }

  input[type=text] {
    width: 100%; padding: 15px 18px; border: 2px solid var(--line); border-radius: var(--r-md);
    font-size: 16.5px; font-family: inherit; background: #fff; color: var(--ink);
  }
  input[type=text]:focus { outline: none; border-color: var(--blue); background: var(--blue-tint); }

  /* ---------- buttons ---------- */
  .btn {
    background: var(--blue); color: #fff; border: 0; border-radius: 999px;
    padding: 15px 34px; font-size: 16px; font-family: inherit; cursor: pointer; font-weight: 700;
    box-shadow: 0 10px 20px -12px rgba(0,74,173,.9); transition: transform .12s, background .15s;
  }
  .btn:hover { background: var(--blue-deep); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { background: #c4cbd8; box-shadow: none; cursor: not-allowed; transform: none; }
  .btn.sun { background: var(--yellow); color: #4a3800; box-shadow: 0 10px 20px -12px rgba(217,168,0,.95); }
  .btn.sun:hover { background: var(--yellow-deep); }
  .btn.line {
    background: #fff; color: var(--blue); border: 2px solid var(--blue); box-shadow: none; padding: 13px 28px;
  }
  .btn.line:hover { background: var(--blue-tint); }
  .btn.line:disabled { color: #a8b1c7; border-color: var(--line); }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 26px; flex-wrap: wrap; }

  /* ---------- illustration ---------- */
  .art { display: block; margin: 0 auto 18px; width: clamp(150px, 34vw, 210px); height: auto; }
  .art-sm { width: clamp(110px, 24vw, 140px); }
  /* Character artwork drops in here once the file arrives; the skill illustration
     above is the stand-in until then. */
  .mascot { display: block; margin: 0 auto 14px; width: clamp(120px, 26vw, 168px); }

  /* ---------- listening ---------- */
  .player {
    background: var(--blue-deep); color: #eaf1ff; border-radius: var(--r-lg); padding: 20px; margin: 0 0 20px;
  }
  .player .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .player .bar { height: 8px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; margin: 16px 0 10px; }
  .player .bar i { display: block; height: 100%; width: 0; background: var(--yellow); border-radius: 999px; }
  .player button {
    background: var(--yellow); color: #4a3800; border: 0; border-radius: 999px; padding: 12px 26px;
    font-weight: 700; cursor: pointer; font-family: inherit; font-size: 15px;
  }
  .player button:disabled { background: rgba(255,255,255,.2); color: rgba(255,255,255,.5); cursor: not-allowed; }
  .player .meta { font-size: 13px; color: #b9cbee; }
  .notes { background: var(--blue-tint); border-radius: var(--r-md); padding: 18px 20px; }
  .notes h4 { margin: 0 0 14px; font-size: 15.5px; font-weight: 700; }
  .notes .line { display: flex; gap: 9px; align-items: center; margin: 14px 0; flex-wrap: wrap; font-size: 16px; }
  .notes .line input { flex: 1 1 150px; max-width: 220px; padding: 11px 14px; font-size: 15px; }
  .qgroup { padding: 18px 0; border-top: 1px dashed #cfdcf3; }
  .qgroup:first-child { border-top: 0; padding-top: 0; }

  /* ---------- writing chart ---------- */
  .chart { background: #fff; border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; margin: 0 0 20px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart figcaption { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }
  .sentence { font-size: clamp(16px, 2.4vw, 18.5px); line-height: 2.2; margin: 0 0 18px; }
  .sentence u { text-decoration-color: var(--yellow-deep); text-decoration-thickness: 3px; text-underline-offset: 6px; }

  /* ---------- speaking ---------- */
  .rec { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .dot { width: 12px; height: 12px; border-radius: 999px; background: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.85); } }
  audio { max-width: 100%; }

  /* ---------- report ---------- */
  .letter {
    background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: clamp(24px, 4vw, 40px); box-shadow: 0 14px 34px -24px rgba(27,34,48,.35);
  }
  .letter .from { font-size: 13px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .verdict {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 22px 0; border-bottom: 2px solid var(--yellow); margin-bottom: 22px;
  }
  .verdict .num { font-size: clamp(40px, 8vw, 58px); font-weight: 700; color: var(--blue); line-height: 1; }
  .bandrow {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 15px 0; border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  .bandrow .skill { font-weight: 600; }
  .pill {
    background: var(--blue-soft); color: var(--blue); font-weight: 700;
    padding: 6px 18px; border-radius: 999px; font-size: 15.5px; white-space: nowrap;
  }
  .pill.low { background: var(--bad-soft); color: var(--bad); }
  .pill.high { background: var(--good-soft); color: var(--good); }
  .pill.pending { background: #f0eee7; color: var(--muted); }
  .fb { border-radius: var(--r-md); padding: 14px 17px; font-size: 14.5px; margin-top: 14px; }
  .fb.no { background: var(--bad-soft); color: var(--bad); }
  .fb.info { background: var(--yellow-soft); color: #6b5000; }
  ul.reasons { margin: 10px 0 0; padding-left: 22px; font-size: 14.5px; color: var(--muted); }
  ul.reasons li { margin: 6px 0; }
  .wrongitem { padding: 20px 0; border-top: 1px solid var(--line); }
  .tag { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
  .sign { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14.5px; color: var(--muted); }
</style>
</head>

const MIDPOINTS = { 'below5.5': 5, '5.5-6': 5.75, '6': 6, '6-6.5': 6.25, '6.5': 6.5, '6.5-7': 6.75, '7plus': 7 };

const scoreReading = (t, h) => {
  if (t === 0) return 'below5.5';
  if (t < 3) return '5.5-6';
  if (h === null) return '5.5-6';
  if (h === 3) return '6.5-7';
  return h >= 1 ? '6' : '5.5-6';
};
const scoreListening = (s1, s2, s4) => {
  if (s1 <= 1) return 'below5.5';
  if (s1 < 4) return '5.5-6';
  if (s2 === null || s2 <= 1) return '5.5-6';
  if (s2 === 2) return '6';
  if (s4 === null) return '6.5';
  return s4 === 3 ? '7plus' : '6.5';
};
const scoreWriting = (g1, g2, g3) => {
  if (g1 === 0) return 'below5.5';
  if (g1 < 2) return '5.5-6';
  if (g2 !== true) return '6';
  if (g3 !== true) return '6-6.5';
  return '6.5-7';
};
const matches = (given, accepted) => {
  const norm = v => String(v).toLowerCase().replace(/[’']/g, "'").replace(/,(?=\d)/g, '').replace(/\s+/g, ' ').replace(/\.$/, '').trim();
  return accepted.some(a => norm(a) === norm(given));
};

function playClip() {
  const clip = LISTENING[listenPhase];
  if (playsUsed >= MAX_PLAYS) return;
  playsUsed++;
  el('play-btn').disabled = true;
  el('clip-status').textContent = 'กำลังโหลดเสียง…';
  audio = new Audio(clip.url);
  audio.addEventListener('loadedmetadata', () => {
    // A moved or re-encoded file would silently play the wrong stretch, so refuse
    // to clip unless the duration matches the one these offsets were measured on.
    if (Math.abs(audio.duration - clip.fileDuration) > 2) {
      el('clip-status').textContent = '⚠ ไฟล์เสียงไม่ตรงกับที่บันทึกไว้ — กรุณาแจ้งผู้สอนครับ';
      el('play-btn').disabled = false;
      playsUsed--; audio = null; return;
    }
    audio.currentTime = clip.start;
    audio.play();
    el('clip-status').textContent = 'กำลังเล่น…';
  });
  audio.addEventListener('timeupdate', () => {
    const pct = Math.min(100, Math.max(0, ((audio.currentTime - clip.start) / (clip.end - clip.start)) * 100));
    const f = el('clip-fill'); if (f) f.style.width = pct + '%';
    if (audio.currentTime >= clip.end) {
      audio.pause();
      const s = el('clip-status'); if (s) s.textContent = playsUsed >= MAX_PLAYS ? 'เล่นครบ 2 ครั้งแล้ว' : 'เล่นจบแล้ว — เล่นได้อีก 1 ครั้ง';
      const m = el('clip-meta'); if (m) m.textContent = 'เหลือ ' + (MAX_PLAYS - playsUsed) + ' ครั้ง';
      const b = el('play-btn'); if (b) b.disabled = playsUsed >= MAX_PLAYS;
    }
  });
  audio.addEventListener('error', () => {
    el('clip-status').textContent = '⚠ โหลดเสียงไม่สำเร็จ — ตรวจอินเทอร์เน็ตหรือแจ้งผู้สอนครับ';
    el('play-btn').disabled = false;
    playsUsed--;
  });
}

function submitListening() {
  const clip = LISTENING[listenPhase];
  let correct = 0;
  clip.qs.forEach(q => {
    const node = document.querySelector('input[name="l' + listenPhase + '-' + q.n + '"]:checked');
    const given = q.opts ? (node ? node.value : '') : ((el('l' + listenPhase + '-' + q.n) || {}).value || '');
    if (given && matches(given, q.a)) correct++;
    else state.listening.wrong.push({ q: q.line, given: given || '(ไม่ได้ตอบ)', answer: q.a[0], why: q.why });
  });
  if (audio) { audio.pause(); audio = null; }
  playsUsed = 0;

  if (listenPhase === 's1') {
    state.listening.s1 = correct;
    if (correct < 4) { state.listening.band = scoreListening(correct, null, null); go('writing-intro'); return; }
    listenPhase = 's2';
    cheer('ฟังได้ครบทุกข้อ!', 'ไปต่อที่บทสนทนาที่ยากขึ้นกันครับ', 'listening-intro'); return;
  }
  if (listenPhase === 's2') {
    state.listening.s2 = correct;
    if (correct < 3) { state.listening.band = scoreListening(state.listening.s1, correct, null); go('writing-intro'); return; }
    listenPhase = 's4';
    cheer('ยอดเยี่ยมครับ!', 'ชุดสุดท้ายเป็นเลกเชอร์วิชาการ ระดับเดียวกับ Band 7 ครับ', 'listening-intro'); return;
  }
  state.listening.s4 = correct;
  state.listening.band = scoreListening(state.listening.s1, state.listening.s2, correct);
  go('writing-intro');
}

function nextWriting() {

async function startRec() {
  const row = el('rec-row');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      state.speaking.clips[state.qi] = { blob, url: URL.createObjectURL(blob), seconds: recSeconds };
      clearInterval(recTimer);
      render();
    };
    recorder.start();
    recSeconds = 0;
    row.innerHTML = '<span class="dot"></span><span class="note" id="rec-time">กำลังอัด 0 วินาที</span><button class="btn line" onclick="stopRec()">■ หยุดอัด</button>';
    recTimer = setInterval(() => {
      recSeconds++;
      const t = el('rec-time');
      if (t) t.textContent = 'กำลังอัด ' + recSeconds + ' วินาที';
    }, 1000);
  } catch (err) {
    row.innerHTML = '<span class="note">ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตการใช้ไมค์ในเบราว์เซอร์ครับ</span>';
  }
}

async function submitSpeaking() {
  try {
    const responses = [];
    for (let i = 0; i < SPEAKING_QS.length; i++) {
      const fd = new FormData();
      fd.append('audio', state.speaking.clips[i].blob, 'answer' + i + '.webm');
      const r = await fetch('/api/transcribe', { method: 'POST', body: fd });
      if (!r.ok) throw new Error('transcribe failed');
      const data = await r.json();
      responses.push({ part: SPEAKING_QS[i].part, question: SPEAKING_QS[i].q, response: data.text });
    }
    const r2 = await fetch('/api/placement/speaking-assess', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questionResponses: responses })
    });
    if (!r2.ok) throw new Error('assess failed');
    const { signals } = await r2.json();
    const result = scoreSpeakingSignals(signals);
    state.speaking.band = result.band;
    state.speaking.reasons = result.reasons;
    state.speaking.pending = false;
  } catch (err) {
    // Opened as a plain file there is no server to call; the other three skills
    // still report, and speaking is shown as awaiting marking rather than faked.
    state.speaking.pending = true;
  }
  go('report');
}

function scoreSpeakingSignals(s) {
  const reasons = [];
  const shortest = s.sentenceCountsPerQuestion.length ? Math.min(...s.sentenceCountsPerQuestion) : 0;
  const colls = s.b2c1Collocations.length;
  if (s.vocabularyErrorCount >= 4) {
    reasons.push('ใช้คำศัพท์ผิดบริบท ' + s.vocabularyErrorCount + ' จุด ทำให้ความหมายสะดุดบ่อยครับ');
    return { band: 'below5.5', reasons };
  }
  if (s.tenseErrorCount > 0 || s.articleErrorCount > 0) {
    if (s.tenseErrorCount > 0) reasons.push('ยังมี tense ผิด ' + s.tenseErrorCount + ' จุด (present simple / past simple) ครับ');
    if (s.articleErrorCount > 0) reasons.push('ยังมี article (a / an / the) ผิด ' + s.articleErrorCount + ' จุดครับ');
    return { band: '5.5-6', reasons };
  }
  if (s.vocabularyErrorCount > 0) {
    reasons.push('ไวยากรณ์สะอาดแล้ว แต่ยังใช้คำศัพท์ผิดบริบท ' + s.vocabularyErrorCount + ' จุดครับ');
    return { band: '6', reasons };
  }
  if (!s.usedPastTense || !s.pastTenseCorrect) {
    reasons.push(s.usedPastTense ? 'มีการใช้ past tense แต่ยังไม่ถูกต้อง เลยยังขยับขึ้นไม่ได้ครับ' : 'ไม่มีข้อผิดพลาด แต่ยังไม่ได้ใช้ past tense เลยครับ');
    return { band: '6', reasons };
  }
  if (!s.ideasOrganised || s.transitionsUsed.length === 0) {
    reasons.push(s.transitionsUsed.length === 0 ? 'ไวยากรณ์ถูกต้อง แต่ยังไม่มีคำเชื่อม (transition) เลย ไอเดียจึงยังไม่ต่อกันครับ' : 'ไวยากรณ์ถูกต้อง แต่การเรียบเรียงไอเดียยังไม่เป็นลำดับครับ');
    return { band: '6-6.5', reasons };
  }
  reasons.push('ไม่มี article หรือ tense ผิด และใช้ past tense ได้ถูกต้องครับ');
  if (shortest < 4) {
    reasons.push('แต่คำตอบบางข้อสั้นเกินไป เลยหยุดไว้ที่ 6.5 ครับ');
    return { band: '6.5', reasons };
  }
  if (s.sentenceCountsPerQuestion.every(c => c > 4) && colls >= 6) {
    reasons.push('ตอบยาวครบทุกข้อ และใช้ collocation ระดับ B2–C1 ' + colls + ' จุดครับ');
    return { band: '7plus', reasons };
  }
  reasons.push(colls > 0 ? 'ใช้ collocation ระดับ B2–C1 ' + colls + ' จุด ซึ่งยังไม่พอสำหรับ 7.0 ครับ' : 'แต่คำศัพท์ยังเป็นระดับพื้นฐานเป็นส่วนใหญ่ครับ');
  return { band: '6.5', reasons };
}

function pill(band) {
  if (!band) return '<span class="pill pending">รอผลตรวจ</span>';
  const cls = (band === 'below5.5' || band === '5.5-6') ? 'low' : (band === '6.5-7' || band === '7plus') ? 'high' : '';
  return '<span class="pill ' + cls + '">' + LABELS[band] + '</span>';
}

S.report = () => {
  const rows = [
    ['การอ่าน', state.reading.band, state.reading.wrong],
    ['การฟัง', state.listening.band, state.listening.wrong],
    ['การเขียน', state.writing.band, state.writing.wrong],
    ['การพูด', state.speaking.band, []]
  ];
  const scored = rows.filter(r => r[1]);
  const avg = scored.reduce((sum, r) => sum + MIDPOINTS[r[1]], 0) / (scored.length || 1);
  const overall = (Math.round(avg * 2) / 2).toFixed(1);
  const weakest = scored.slice().sort((a, b) => MIDPOINTS[a[1]] - MIDPOINTS[b[1]])[0];
  const allWrong = rows.flatMap(r => r[2].map(w => ({ skill: r[0], ...w })));

  return `
<div class="letter fade">
  <div class="from">ผลประเมินระดับ · English Plan</div>
  <div class="verdict">
    <div>
      <div class="note" style="margin-bottom:2px">ระดับโดยประมาณของ ${esc(state.student.name || 'คุณ')}</div>
      <div class="num">${overall}</div>
    </div>
  </div>

  <p style="font-size:16.5px;margin:0 0 18px">
    เรียนคุณ${esc(state.student.name || '')} ครับ — จากคำตอบทั้งหมดที่ส่งมา ระดับโดยประมาณของคุณอยู่ที่ <strong>${overall}</strong>
    ${weakest ? 'โดยทักษะที่ควรเริ่มซ่อมก่อนคือ<strong>' + esc(weakest[0]) + '</strong> เพราะเป็นตัวที่ดึงคะแนนรวมลงมากที่สุดครับ' : ''}
  </p>

  <h2 style="font-size:19px;margin-top:26px">ผลรายทักษะ</h2>
  ${rows.map(r => `<div class="bandrow"><span class="skill">${r[0]}</span>${pill(r[1])}</div>`).join('')}

  ${state.speaking.reasons.length ? `
    <div style="margin-top:22px">
      <div class="tag">เหตุผลของคะแนนการพูด</div>
      <ul class="reasons">${state.speaking.reasons.map(x => '<li>' + esc(x) + '</li>').join('')}</ul>
    </div>` : ''}
  ${state.speaking.pending ? '<div class="fb info">คำตอบส่วนการพูดถูกบันทึกไว้แล้ว ผู้สอนจะตรวจและส่งผลกลับไปครับ</div>' : ''}

  ${allWrong.length ? `
    <h2 style="font-size:19px;margin-top:30px">จุดที่ควรซ่อม</h2>
    <p class="note">ดูไว้เพื่อรู้ว่าต้องแก้ตรงไหน ไม่ต้องจำคำตอบครับ</p>
    ${allWrong.map(w => `
      <div class="wrongitem">
        <div class="tag">${esc(w.skill)}</div>
        <p style="font-weight:600;margin:6px 0 10px">${esc(w.q)}</p>
        <div class="fb no">ตอบว่า <strong>${esc(w.given)}</strong> · คำตอบที่ถูกคือ <strong>${esc(w.answer)}</strong></div>
        <p class="note" style="margin-top:10px">${esc(w.why)}</p>
      </div>`).join('')}` : ''}

  <div class="sign">
    ผลนี้มาจากแบบทดสอบสั้น ประเมินเทียบกับสถิติผลสอบจริงของนักเรียน English Plan ที่ผ่านมา
    ไม่ใช่คะแนนสอบอย่างเป็นทางการครับ ทีมผู้สอนจะติดต่อกลับทาง ${esc(state.student.contact || 'ช่องทางที่ให้ไว้')}
    พร้อมแผนเรียนที่เหมาะกับระดับนี้ครับ
  </div>
</div>`;
};

/* ------------------------------------------------------------------- render */

const SKILL_OF = {
  warning: null, intro: null, cheer: null,
  'reading-intro': 0, 'reading-tfng': 0, 'reading-head': 0,
  'listening-intro': 1, 'listening-q': 1,
  'writing-intro': 2, 'writing-q': 2,
  'speaking-intro': 3, 'speaking-q': 3, 'speaking-sending': 3,
  report: 4
};
const SKILL_NAMES = ['การอ่าน', 'การฟัง', 'การเขียน', 'การพูด'];

function render() {
  const stage = el('stage');
  stage.classList.remove('leaving');
  stage.innerHTML = S[state.screen]();

  const active = SKILL_OF[state.screen];
  el('topbar').style.visibility = active === null ? 'hidden' : 'visible';
  el('segs').innerHTML = SKILL_NAMES.map((_, i) => {
    const done = active !== null && (i < active || active === 4);
    return '<span class="seg ' + (done ? 'done' : '') + '"><i style="width:' + (i === active ? '50%' : '0') + '"></i></span>';
  }).join('');
  el('poslabel').textContent = active === 4 ? 'ผลลัพธ์' : (active === null ? '' : SKILL_NAMES[active]);
}

function fillPerfect() {
  state.student.name = state.student.name || 'ตัวอย่าง นักเรียน';
  state.reading = { tfng: 3, headings: 3, band: '6.5-7', wrong: [] };
  state.listening = { s1: 4, s2: 3, s4: 3, band: '7plus', wrong: [] };
  state.writing = { g1: 2, g2: true, g3: true, band: '6.5-7', wrong: [] };
  state.speaking = { band: null, reasons: [], pending: true, clips: {} };
  go('report');
}

/* The test cannot be retaken, so a stray refresh or closed tab must not be silent. */
window.addEventListener('beforeunload', (e) => {
  if (['warning', 'intro', 'report'].includes(state.screen)) return;
  e.preventDefault();
  e.returnValue = '';
});

render();
</script>
</body>
</html>
